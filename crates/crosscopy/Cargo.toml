[package]
name = "crosscopy"
description = "Cross-platform clipboard sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crosscopy-clipboard.workspace = true
crosscopy-core.workspace = true
crosscopy-net.workspace = true
directories = "6.0.0"
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "signal"] }
toml = "1.1.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
