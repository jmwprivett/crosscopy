[package]
name = "crosscopy-net"
description = "Encrypted peer-to-peer transport for crosscopy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
crosscopy-core.workspace = true
getrandom = "0.4.3"
if-addrs = "0.15.0"
mdns-sd = "0.21.5"
postcard = { version = "1.1.3", features = ["alloc"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
