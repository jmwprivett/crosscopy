[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
crosscopy = { path = "crates/crosscopy" }
crosscopy-core = { path = "crates/crosscopy-core" }
crosscopy-clipboard = { path = "crates/crosscopy-clipboard" }
crosscopy-net = { path = "crates/crosscopy-net" }
crosscopy-update = { path = "crates/crosscopy-update" }
